name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Baixar núcleo mGBA (libretro)
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi tmp_$abi
            curl -fL "https://buildbot.libretro.com/nightly/android/latest/$abi/mgba_libretro_android.so.zip" -o core_$abi.zip
            unzip -o core_$abi.zip -d tmp_$abi
            mv tmp_$abi/mgba_libretro_android.so app/src/main/jniLibs/$abi/libmgba_core.so
          done
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GbaEmu-debug
          path: app/build/outputs/apk/debug/*.apk
